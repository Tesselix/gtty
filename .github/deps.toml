#
# Every package `zig build --fetch=all` brings in (build.zig.zon and what
# its dependencies pull in), as reviewed: its hash, its licenses, and
# where the vulnerability database (OSV.dev) knows it. Checked by
# scripts/check-deps.py (workflow deps.yml: every PR, pushes to main,
# weekly).
#
# A dependency changed in build.zig.zon (new hash) fails the check until
# its entry here is updated: look at its license again, then put in the
# new `hash`, the license files' sha256, `licenses` and the upstream
# `commit`. `scripts/check-deps.py --print` prints what it finds in
# zig-pkg/ to start from.

# Licenses gtty (GPL-3.0-or-later) can ship code under. An SPDX
# expression passes when it can be satisfied with these: every side of an
# AND, one side of an OR. Not here, so never accepted: GPL-2.0-only,
# AFL-*, anything non-free.
allowed = [
    "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "FTL",
    "GPL-2.0-or-later", "GPL-3.0-only", "GPL-3.0-or-later", "HIDAPI",
    "HPND", "HPND-sell-variant", "ISC", "LGPL-2.1-or-later",
    "libpng-2.0", "MIT", "MIT-0", "MIT-Modern-Variant", "MIT-open-group",
    "SunPro", "Unlicense", "X11",
    "Zlib",
]
# Exceptions after WITH that are fine.
allowed_exceptions = ["Linux-syscall-note"]

# The weekly run fails on known vulnerabilities rated this or worse (low,
# medium, high, critical; from their CVSS score); lower ones are only
# reported. Unrated ones always count.
fail_severity = "high"

# Known vulnerabilities looked at and accepted for now (they stop failing
# the weekly run): { id = "CVE-…", package = "zlib", reason = "…",
# until = "YYYY-MM-DD" }. Past `until` they count again.
ignore = [
    { id = "CVE-2026-76844", package = "zlib", until = "2027-04-22", reason = "gzwrite.c (the gz* file API) is not built into gtty (build.zig compiles only the core zlib files); no fixed zlib release yet" },
    { id = "CVE-2026-85091", package = "zlib", until = "2027-04-22", reason = "gz_vacate is in gzwrite.c, not built into gtty (see build.zig); no fixed zlib release yet" },
]

