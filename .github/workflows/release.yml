#
# Release: a release published in the GitHub UI (Releases → Draft a new
# release, which creates the tag vMAJOR.MINOR.PATCH on main) gets its
# files here: the self-contained binaries, the signed + notarized macOS
# dmg (scripts/sign-macos.sh), the .deb / .rpm / .tar.gz, SHA256SUMS and
# SLSA build provenance (*.intoto.jsonl).
#
# The tag is the version (written into build.zig.zon before the build, not
# committed); nothing in the repo holds one. Its MINOR picks the kind of release:
#   odd  (v1.3.0, v0.5.2)  a pre-release, built in the environment "edge";
#   even (v1.4.0, v0.6.1)  a stable release, marked latest, built in the
#                          environment "release".
#
# The signing secrets (in both environments: MACOS_CERT_P12,
# MACOS_CERT_PASSWORD, KEYCHAIN_PASSWORD, APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_TEAM_ID) are loaded by
# scripts/set-github-secrets.sh.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  # The tag's form, and pre-release or stable from its MINOR.
  channel:
    name: Check the tag, set the release kind
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release edit
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      environment: ${{ steps.kind.outputs.environment }}
    steps:
      - name: Check the tag
        id: check
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG isn't vMAJOR.MINOR.PATCH (digits only)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Pre-release or stable
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minor=${TAG#v*.}
          minor=${minor%%.*}
          if (( 10#$minor % 2 == 1 )); then
            echo "$TAG: odd minor, a pre-release"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            echo "environment=edge" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG: even minor, a stable release (latest)"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
            echo "environment=release" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, sign, notarize, upload
    needs: channel
    runs-on: macos-15
    environment: ${{ needs.channel.outputs.environment }}
    permissions:
      contents: write # gh release upload
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.sums.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version: setup-zig reads minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Install packaging tools
        run: brew install nfpm

      # The tag's version into build.zig.zon (never committed): the binary
      # reports it, package.sh names the packages after it.
      - name: Version into build.zig.zon
        run: |
          v=${TAG#v}
          sed -i '' "s/^\( *\.version = \)\"[^\"]*\"/\1\"$v\"/" build.zig.zon
          grep -q "^ *\.version = \"$v\"," build.zig.zon || { echo "could not set the version in build.zig.zon" >&2; exit 1; }

      # build-bin.sh (macOS + Linux binaries, ReleaseSafe),
      # package.sh (dmg, deb, rpm, tar.gz), signing in a temporary
      # keychain, notarization + staple.
      - name: Build, sign and notarize
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/sign-macos.sh

      # stapler and spctl ask Apple's servers, which drop the connection
      # now and then (stapler: "The network connection was lost", error
      # 68): those are tried up to 5 times, as package.sh's staple.
      - name: Check the dmg
        run: |
          retry() {
            n=$1; shift
            for i in $(seq "$n"); do
              "$@" && return 0
              [ "$i" -lt "$n" ] && { echo "retrying in 15 s ($i/$n failed): $*"; sleep 15; }
            done
            return 1
          }
          dmg="dist/gtty-${TAG#v}-macos.dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          retry 5 xcrun stapler validate "$dmg"
          retry 5 spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's|^/dev/[^[:space:]]*[[:space:]]*Apple_HFS[[:space:]]*||p')
          codesign --verify --deep --strict --verbose=2 "$mnt/gtty.app"
          retry 5 spctl --assess --type execute --verbose "$mnt/gtty.app"
          hdiutil detach -quiet "$mnt"

      # Copies of the packages without the version in their names, so
      # releases/latest/download/<name> (the README's install lines) always
      # finds the newest stable one. The dmg's notarization ticket is
      # stapled inside it, so its copy is notarized too.
      - name: Fixed-name copies
        run: |
          v=${TAG#v}
          cd dist
          cp "gtty_${v}_amd64.deb" gtty_amd64.deb
          cp "gtty-$v-1.x86_64.rpm" gtty.x86_64.rpm
          cp "gtty-$v-linux-x86_64.tar.gz" gtty-linux-x86_64.tar.gz
          cp "gtty-$v-macos.dmg" gtty-macos.dmg

      # SHA256SUMS for users; the same lines, base64, are the provenance's
      # subjects.
      - name: Checksums
        id: sums
        run: |
          v=${TAG#v}
          cd dist
          shasum -a 256 "gtty-$v-macos.dmg" "gtty_${v}_amd64.deb" \
            "gtty-$v-1.x86_64.rpm" "gtty-$v-linux-x86_64.tar.gz" \
            gtty-macos.dmg gtty_amd64.deb gtty.x86_64.rpm \
            gtty-linux-x86_64.tar.gz > SHA256SUMS
          cat SHA256SUMS
          echo "hashes=$(base64 < SHA256SUMS | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${TAG#v}
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/gtty-$v-macos.dmg" "dist/gtty_${v}_amd64.deb" \
            "dist/gtty-$v-1.x86_64.rpm" "dist/gtty-$v-linux-x86_64.tar.gz" \
            dist/gtty-macos.dmg dist/gtty_amd64.deb dist/gtty.x86_64.rpm \
            dist/gtty-linux-x86_64.tar.gz dist/SHA256SUMS

  # SLSA build provenance for the Signed-Releases check, uploaded to the
  # release as gtty.intoto.jsonl. The generator must be referenced by tag,
  # not SHA (its documented requirement; Scorecard accepts it).
  provenance:
    name: SLSA provenance
    needs: [channel, build]
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance
      contents: write # upload it to the release
    # By tag, not SHA: the generator verifies its own ref and fails when
    # pinned to a commit (see its README). CodeQL's unpinned-tag alert
    # for this line is dismissed as "won't fix"; Scorecard exempts it.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: gtty.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ needs.channel.outputs.tag }}

  # The README's edge badge: the last published pre-release's tag in a
  # shields.io endpoint file, edge.json, alone on the orphan branch
  # `badges` (one commit, replaced on every release, stable ones too;
  # shields reads it from raw.githubusercontent.com, it refuses release
  # assets on github.com). A pre-release published before the latest
  # stable release isn't the edge: then the badge is empty and
  # transparent, so nothing shows. Through the API: no checkout, no token in a git URL.
  edge-badge:
    name: Edge badge
    needs: [channel, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the badges branch
    steps:
      - name: Write edge.json on the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=$GITHUB_REPOSITORY
          # By publish time, not version: edge keeps its own (lower) MINOR
          # while stable moves on, so a newer edge can be 1.9.x after 1.10.x.
          # (read fails on no input, and steps run with bash -e: || true.)
          read -r edge edge_at < <(gh api "repos/$repo/releases?per_page=100" \
            --jq '[.[] | select(.prerelease and (.draft | not))] | max_by(.published_at) // empty | "\(.tag_name) \(.published_at)"') || true
          read -r stable stable_at < <(gh api "repos/$repo/releases/latest" \
            --jq '"\(.tag_name) \(.published_at)"' 2>/dev/null) || true
          # ISO 8601 times (UTC, same form) compare as strings.
          if [ -n "$edge" ] && { [ -z "$stable" ] || [[ "$edge_at" > "$stable_at" ]]; }; then
            tag=$edge
            json=$(jq -nc --arg t "$tag" '{schemaVersion: 1, label: "edge", message: $t, color: "orange"}')
          else
            tag="none (stable ${stable:-none} is newest)"
            json=$(jq -nc '{schemaVersion: 1, label: " ", message: " ", color: "rgba(0,0,0,0)", labelColor: "rgba(0,0,0,0)", style: "flat-square"}')
          fi
          blob=$(gh api "repos/$repo/git/blobs" -f content="$json" -f encoding=utf-8 --jq .sha)
          tree=$(gh api "repos/$repo/git/trees" -f 'tree[][path]=edge.json' -f 'tree[][mode]=100644' \
            -f 'tree[][type]=blob' -f "tree[][sha]=$blob" --jq .sha)
          # No parents: the branch holds this one commit only.
          commit=$(gh api "repos/$repo/git/commits" -f message="edge badge: $tag" -f tree="$tree" --jq .sha)
          if gh api "repos/$repo/git/ref/heads/badges" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$repo/git/refs/heads/badges" -f sha="$commit" -F force=true --silent
          else
            gh api "repos/$repo/git/refs" -f ref=refs/heads/badges -f sha="$commit" --silent
          fi
          echo "edge badge: $tag"
          echo "$json"
