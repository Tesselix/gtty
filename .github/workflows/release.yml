# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release: a release published in the GitHub UI (Releases → Draft a new
# release, which creates the tag vMAJOR.MINOR.PATCH on main) gets its
# files here: the self-contained binaries, the signed + notarized macOS
# dmg (scripts/sign-macos.sh), the .deb / .rpm / .tar.gz, the SDKs for
# extensions (gtty-sdk-*.tar.gz), SHA256SUMS and SLSA build provenance
# (*.intoto.jsonl). A stable release also updates the Homebrew cask in
# tesselix/homebrew-tap (job homebrew) and the apt / rpm repositories at
# https://tesselix.github.io/gtty/ (jobs repo, pages); its rpms are signed
# with the repositories' key.
#
# The tag is the version (written into build.zig.zon before the build, not
# committed); nothing in the repo holds one. Its MINOR picks the kind of release:
#   odd  (v1.3.0, v0.5.2)  a pre-release, built in the environment "edge";
#   even (v1.4.0, v0.6.1)  a stable release, marked latest, built in the
#                          environment "release".
#
# The signing secrets (in both environments: MACOS_CERT_P12,
# MACOS_CERT_PASSWORD, KEYCHAIN_PASSWORD, APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_TEAM_ID) are loaded by
# scripts/set-github-secrets.sh.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  # The tag's form, and pre-release or stable from its MINOR.
  channel:
    name: Check the tag, set the release kind
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release edit
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      environment: ${{ steps.kind.outputs.environment }}
    steps:
      - name: Check the tag
        id: check
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG isn't vMAJOR.MINOR.PATCH (digits only)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Pre-release or stable
        id: kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minor=${TAG#v*.}
          minor=${minor%%.*}
          if (( 10#$minor % 2 == 1 )); then
            echo "$TAG: odd minor, a pre-release"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
            echo "environment=edge" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG: even minor, a stable release (latest)"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
            echo "environment=release" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build, sign, notarize, upload
    needs: channel
    runs-on: macos-15
    environment: ${{ needs.channel.outputs.environment }}
    permissions:
      contents: write # gh release upload
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.sums.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version: setup-zig reads minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Install packaging tools
        run: brew install nfpm

      # The tag's version into build.zig.zon (never committed): the binary
      # reports it, package.sh names the packages after it.
      - name: Version into build.zig.zon
        run: |
          v=${TAG#v}
          sed -i '' "s/^\( *\.version = \)\"[^\"]*\"/\1\"$v\"/" build.zig.zon
          grep -q "^ *\.version = \"$v\"," build.zig.zon || { echo "could not set the version in build.zig.zon" >&2; exit 1; }

      # Stable releases sign their rpms with the repositories' key
      # (nfpm.yaml: NFPM_RPM_KEY_FILE, NFPM_RPM_PASSPHRASE; secrets
      # REPO_GPG_KEY and REPO_GPG_PASSPHRASE, environment "release" only,
      # loaded by scripts/set-repo-key.sh). Pre-releases: unsigned.
      - name: Key for the rpms
        env:
          CHANNEL: ${{ needs.channel.outputs.environment }}
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
        run: |
          if [ -z "$REPO_GPG_KEY" ]; then
            if [ "$CHANNEL" = release ]; then
              echo "::error::no REPO_GPG_KEY in the environment release: run scripts/set-repo-key.sh"
              exit 1
            fi
            echo "pre-release: the rpms stay unsigned"
            exit 0
          fi
          umask 077
          printf '%s\n' "$REPO_GPG_KEY" > "$RUNNER_TEMP/repo-key.asc"
          echo "NFPM_RPM_KEY_FILE=$RUNNER_TEMP/repo-key.asc" >> "$GITHUB_ENV"

      # build-bin.sh (macOS + Linux binaries, ReleaseSafe),
      # package.sh (dmg, deb, rpm, tar.gz), signing in a temporary
      # keychain, notarization + staple.
      - name: Build, sign and notarize
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/sign-macos.sh

      - name: Remove the rpm key
        if: always()
        run: rm -f "$RUNNER_TEMP/repo-key.asc"

      # stapler and spctl ask Apple's servers, which drop the connection
      # now and then (stapler: "The network connection was lost", error
      # 68): those are tried up to 5 times, as package.sh's staple.
      - name: Check the dmg
        run: |
          retry() {
            n=$1; shift
            for i in $(seq "$n"); do
              "$@" && return 0
              [ "$i" -lt "$n" ] && { echo "retrying in 15 s ($i/$n failed): $*"; sleep 15; }
            done
            return 1
          }
          dmg="dist/gtty-${TAG#v}-macos.dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          retry 5 xcrun stapler validate "$dmg"
          retry 5 spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's|^/dev/[^[:space:]]*[[:space:]]*Apple_HFS[[:space:]]*||p')
          codesign --verify --deep --strict --verbose=2 "$mnt/gtty.app"
          retry 5 spctl --assess --type execute --verbose "$mnt/gtty.app"
          hdiutil detach -quiet "$mnt"

      # Copies of the packages without the version in their names, so
      # releases/latest/download/<name> (the README's install lines) always
      # finds the newest stable one. The dmg's notarization ticket is
      # stapled inside it, so its copy is notarized too.
      - name: Fixed-name copies
        run: |
          v=${TAG#v}
          cd dist
          for a in amd64 arm64; do
            cp "gtty-$v-$a.deb" "gtty-$a.deb"
          done
          for a in x86_64 aarch64; do
            cp "gtty-$v-$a.rpm" "gtty-$a.rpm"
            cp "gtty-$v-linux-$a.tar.gz" "gtty-linux-$a.tar.gz"
          done
          # The old x86_64 names (underscores / dots), still asked for by
          # older gttys' update line (Update.installCommand) and old links
          # to latest/download; drop once few run those versions.
          cp "gtty-$v-amd64.deb" "gtty_${v}_amd64.deb"
          cp "gtty-$v-amd64.deb" gtty_amd64.deb
          cp "gtty-$v-x86_64.rpm" "gtty-$v-1.x86_64.rpm"
          cp "gtty-$v-x86_64.rpm" gtty.x86_64.rpm
          cp "gtty-$v-macos.dmg" gtty-macos.dmg
          for lang in zig python javascript go; do
            cp "gtty-sdk-$lang-$v.tar.gz" "gtty-sdk-$lang.tar.gz"
          done

      # SHA256SUMS for users; the same lines, base64, are the provenance's
      # subjects. Every package in dist/ (package.sh writes nothing else
      # there), the copies above included.
      - name: Checksums
        id: sums
        run: |
          cd dist
          shasum -a 256 ./*.dmg ./*.deb ./*.rpm ./*.tar.gz | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS
          echo "hashes=$(base64 < SHA256SUMS | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/*.dmg dist/*.deb dist/*.rpm dist/*.tar.gz dist/SHA256SUMS

  # SLSA build provenance for the Signed-Releases check, uploaded to the
  # release as gtty.intoto.jsonl. The generator must be referenced by tag,
  # not SHA (its documented requirement; Scorecard accepts it).
  provenance:
    name: SLSA provenance
    needs: [channel, build]
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance
      contents: write # upload it to the release
    # By tag, not SHA: the generator verifies its own ref and fails when
    # pinned to a commit (see its README). CodeQL's unpinned-tag alert
    # for this line is dismissed as "won't fix"; Scorecard exempts it.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: gtty.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ needs.channel.outputs.tag }}

  # The Homebrew cask (brew install --cask tesselix/tap/gtty): stable
  # releases only, and only the newest one (a patch to an older stable
  # line doesn't move the cask back). packaging/homebrew/gtty.rb.in with
  # the version and the dmg's sha256 (from the release's SHA256SUMS) is
  # written to Casks/gtty.rb in tesselix/homebrew-tap through the API (no
  # checkout of the tap, no token in a git URL), as the GitHub App
  # tesselix-release-bot (installed on homebrew-tap only; Contents write).
  # Its client ID is the variable TAP_CLIENT_ID, its private key the
  # secret TAP_APP_KEY, both in the environment "release" only.
  homebrew:
    name: Homebrew cask
    needs: [channel, build]
    if: needs.channel.outputs.environment == 'release'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/homebrew

      - name: Newest stable release?
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$TAG" ]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG isn't the latest release ($latest): the cask stays"
            echo "write=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fill in the cask
        if: steps.latest.outputs.write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${TAG#v}
          sha=$(gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output - |
            awk -v f="gtty-$v-macos.dmg" '$2 == f {print $1}')
          if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::no sha256 for gtty-$v-macos.dmg in the release's SHA256SUMS"
            exit 1
          fi
          sed -e "s/@VERSION@/$v/g" -e "s/@SHA256@/$sha/g" packaging/homebrew/gtty.rb.in > gtty.rb
          if grep -q @ gtty.rb; then
            echo "::error::a placeholder is left in the cask"
            exit 1
          fi
          cat gtty.rb

      - name: Token for the tap
        if: steps.latest.outputs.write == 'true'
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.TAP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      # One commit on the tap's main; none when the cask is already this
      # (a re-run).
      - name: Write Casks/gtty.rb in the tap
        if: steps.latest.outputs.write == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
        run: |
          path=repos/$TAP/contents/Casks/gtty.rb
          old_sha=$(gh api "$path" --jq .sha 2>/dev/null) || old_sha=
          if [ -n "$old_sha" ] && [ "$(gh api "$path" --jq .content | base64 -d)" = "$(cat gtty.rb)" ]; then
            echo "Casks/gtty.rb is already $TAG"
            exit 0
          fi
          args=(-X PUT "$path" -f message="gtty ${TAG#v}" -f content="$(base64 -w0 < gtty.rb)")
          [ -n "$old_sha" ] && args+=(-f sha="$old_sha")
          gh api "${args[@]}" --jq '"wrote \(.content.path) in \(.commit.sha)"'

  # The apt and rpm repositories at https://tesselix.github.io/gtty/
  # (GitHub Pages of this repo, deployed from Actions): rebuilt from scratch
  # on every stable release that is the newest one, from the packages of
  # the last KEEP stable releases whose rpms carry the repositories' key
  # (older ones, before the key, are left out), checked against each
  # release's SHA256SUMS. scripts/build-repo.sh writes and signs the
  # indexes (apt InRelease, rpm repomd.xml.asc). The key: secrets
  # REPO_GPG_KEY + REPO_GPG_PASSPHRASE, variable REPO_GPG_FINGERPRINT, in
  # the environment "release" only (scripts/set-repo-key.sh). The deploy
  # itself is the job pages, in the environment github-pages (no secrets).
  repo:
    name: apt / rpm repositories
    needs: [channel, build]
    if: needs.channel.outputs.environment == 'release'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.latest.outputs.write }}
    env:
      KEEP: 5
    steps:
      - name: Newest stable release?
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$TAG" ]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG isn't the latest release ($latest): the repositories stay"
            echo "write=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.write == 'true'
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Install the repository tools
        if: steps.latest.outputs.write == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends apt-utils createrepo-c rpm gpgv

      # Into a GnuPG home of its own; the fingerprint must be the variable's,
      # and the key not expire within 60 days (warning) or have expired.
      - name: Import the key
        if: steps.latest.outputs.write == 'true'
        env:
          REPO_GPG_KEY: ${{ secrets.REPO_GPG_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.REPO_GPG_PASSPHRASE }}
          FPR: ${{ vars.REPO_GPG_FINGERPRINT }}
        run: |
          [ -n "$REPO_GPG_KEY" ] && [ -n "$FPR" ] || { echo "::error::REPO_GPG_KEY / REPO_GPG_FINGERPRINT missing: run scripts/set-repo-key.sh"; exit 1; }
          export GNUPGHOME=$RUNNER_TEMP/gnupg
          mkdir -m 700 "$GNUPGHOME"
          umask 077
          printf '%s' "$REPO_GPG_PASSPHRASE" > "$RUNNER_TEMP/repo-key.pass"
          printf '%s\n' "$REPO_GPG_KEY" | gpg --batch --quiet --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/repo-key.pass" --import
          gpg --batch --with-colons --list-secret-keys "$FPR" >/dev/null || { echo "::error::the key isn't $FPR"; exit 1; }
          exp=$(gpg --batch --with-colons --list-keys "$FPR" | awk -F: '/^pub/ {print $7; exit}')
          if [ -n "$exp" ]; then
            days=$(( (exp - $(date +%s)) / 86400 ))
            [ "$days" -lt 0 ] && { echo "::error::the repository key expired on $(date -d "@$exp" +%F): scripts/set-repo-key.sh --extend"; exit 1; }
            [ "$days" -lt 60 ] && echo "::warning::the repository key expires on $(date -d "@$exp" +%F) ($days days): scripts/set-repo-key.sh --extend"
          fi
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Download the packages
        if: steps.latest.outputs.write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FPR: ${{ vars.REPO_GPG_FINGERPRINT }}
        run: |
          mkdir -p pkgs dl
          gpg --batch --armor --export "$FPR" > key.asc
          mkdir -p "$RUNNER_TEMP/rpmdb"
          rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --import key.asc
          tags=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select((.prerelease or .draft) | not) | .tag_name' | sort -V -r | head -n "$KEEP")
          for t in $tags; do
            v=${t#v}
            rm -rf dl && mkdir dl
            for f in "gtty-$v-amd64.deb" "gtty-$v-arm64.deb" "gtty-$v-x86_64.rpm" "gtty-$v-aarch64.rpm"; do
              gh release download "$t" --repo "$GITHUB_REPOSITORY" --dir dl --pattern "$f" 2>/dev/null || true
            done
            # Releases before the hyphen names (gtty_<v>_amd64.deb, …) have none
            # of these, and no signed rpms either: nothing to check or keep.
            ls dl/gtty-* >/dev/null 2>&1 || { echo "$t: left out (no packages under the current names)"; continue; }
            gh release download "$t" --repo "$GITHUB_REPOSITORY" --dir dl --pattern SHA256SUMS
            (cd dl && sha256sum -c --ignore-missing --quiet SHA256SUMS) || { echo "::error::$t: a package doesn't match its SHA256SUMS"; exit 1; }
            rm dl/SHA256SUMS
            signed=true
            for f in dl/*.rpm; do
              [ -e "$f" ] || { signed=false; break; }
              case $(rpmkeys --dbpath "$RUNNER_TEMP/rpmdb" --checksig "$f" 2>&1) in *" signatures OK") ;; *) signed=false ;; esac
            done
            if [ "$signed" = true ] && ls dl/*.deb >/dev/null 2>&1; then
              echo "$t: $(cd dl && echo *)"
              mv dl/* pkgs/
            else
              echo "$t: left out (no rpm signed with the repository key)"
            fi
          done
          ls pkgs/gtty-"${TAG#v}"-* >/dev/null 2>&1 || { echo "::error::$TAG's own packages are missing or unsigned"; exit 1; }

      - name: Build and sign the repositories
        if: steps.latest.outputs.write == 'true'
        env:
          REPO_GPG_FINGERPRINT: ${{ vars.REPO_GPG_FINGERPRINT }}
        run: |
          REPO_GPG_PASSPHRASE_FILE=$RUNNER_TEMP/repo-key.pass scripts/build-repo.sh pkgs site
          rm -f "$RUNNER_TEMP/repo-key.pass"
          rm -rf "$GNUPGHOME"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.latest.outputs.write == 'true'
        with:
          path: site

  # The site of the job repo onto GitHub Pages. The environment
  # github-pages must allow tags v* (Settings → Environments → github-pages
  # → Deployment branches and tags), as releases run on their tag.
  pages:
    name: Deploy the repositories
    needs: repo
    if: needs.repo.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write # deploy
      id-token: write # prove it's this workflow
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The README's edge badge: the last published pre-release's tag in a
  # shields.io endpoint file, edge.json, alone on the orphan branch
  # `badges` (one commit, replaced on every release, stable ones too;
  # shields reads it from raw.githubusercontent.com, it refuses release
  # assets on github.com). A pre-release published before the latest
  # stable release isn't the edge: then the badge is empty and
  # transparent, so nothing shows. Through the API: no checkout, no token in a git URL.
  edge-badge:
    name: Edge badge
    needs: [channel, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the badges branch
    steps:
      - name: Write edge.json on the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=$GITHUB_REPOSITORY
          # By publish time, not version: edge keeps its own (lower) MINOR
          # while stable moves on, so a newer edge can be 1.9.x after 1.10.x.
          # (read fails on no input, and steps run with bash -e: || true.)
          read -r edge edge_at < <(gh api "repos/$repo/releases?per_page=100" \
            --jq '[.[] | select(.prerelease and (.draft | not))] | max_by(.published_at) // empty | "\(.tag_name) \(.published_at)"') || true
          read -r stable stable_at < <(gh api "repos/$repo/releases/latest" \
            --jq '"\(.tag_name) \(.published_at)"' 2>/dev/null) || true
          # ISO 8601 times (UTC, same form) compare as strings.
          if [ -n "$edge" ] && { [ -z "$stable" ] || [[ "$edge_at" > "$stable_at" ]]; }; then
            tag=$edge
            json=$(jq -nc --arg t "$tag" '{schemaVersion: 1, label: "edge", message: $t, color: "orange"}')
          else
            tag="none (stable ${stable:-none} is newest)"
            json=$(jq -nc '{schemaVersion: 1, label: " ", message: " ", color: "rgba(0,0,0,0)", labelColor: "rgba(0,0,0,0)", style: "flat-square"}')
          fi
          blob=$(gh api "repos/$repo/git/blobs" -f content="$json" -f encoding=utf-8 --jq .sha)
          tree=$(gh api "repos/$repo/git/trees" -f 'tree[][path]=edge.json' -f 'tree[][mode]=100644' \
            -f 'tree[][type]=blob' -f "tree[][sha]=$blob" --jq .sha)
          # No parents: the branch holds this one commit only.
          commit=$(gh api "repos/$repo/git/commits" -f message="edge badge: $tag" -f tree="$tree" --jq .sha)
          if gh api "repos/$repo/git/ref/heads/badges" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$repo/git/refs/heads/badges" -f sha="$commit" -F force=true --silent
          else
            gh api "repos/$repo/git/refs" -f ref=refs/heads/badges -f sha="$commit" --silent
          fi
          echo "edge badge: $tag"
          echo "$json"
