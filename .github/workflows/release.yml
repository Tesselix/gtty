#
# Release: a release published in the GitHub UI (Releases → Draft a new
# release, which creates the tag vMAJOR.MINOR.PATCH on main) gets its
# files here: the self-contained binaries, the signed + notarized macOS
# dmg (scripts/sign-macos.sh), the .deb / .rpm / .tar.gz, SHA256SUMS and
# SLSA build provenance (*.intoto.jsonl).
#
# The tag is the version (-Dversion, GTTY_VERSION); nothing in the repo
# holds one. Its MINOR picks the kind of release:
#   odd  (v1.3.0, v0.5.2)  a pre-release;
#   even (v1.4.0, v0.6.1)  a stable release, marked latest.
#
# The signing secrets (environment "release": MACOS_CERT_P12,
# MACOS_CERT_PASSWORD, KEYCHAIN_PASSWORD, APPLE_API_KEY_P8,
# APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_TEAM_ID) are loaded by
# scripts/set-github-secrets.sh.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}

jobs:
  # The tag's form, and pre-release or stable from its MINOR.
  channel:
    name: Check the tag, set the release kind
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release edit
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check the tag
        id: check
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $TAG isn't vMAJOR.MINOR.PATCH (digits only)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Pre-release or stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minor=${TAG#v*.}
          minor=${minor%%.*}
          if (( 10#$minor % 2 == 1 )); then
            echo "$TAG: odd minor, a pre-release"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
          else
            echo "$TAG: even minor, a stable release (latest)"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          fi

  build:
    name: Build, sign, notarize, upload
    needs: channel
    runs-on: macos-15
    environment: release
    permissions:
      contents: write # gh release upload
    timeout-minutes: 60
    outputs:
      hashes: ${{ steps.sums.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No version: setup-zig reads minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Install packaging tools
        run: brew install nfpm

      # build-bin.sh (macOS + Linux binaries, ReleaseSafe, -Dversion),
      # package.sh (dmg, deb, rpm, tar.gz), signing in a temporary
      # keychain, notarization + staple.
      - name: Build, sign and notarize
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export GTTY_VERSION="${TAG#v}"
          scripts/sign-macos.sh

      # stapler and spctl ask Apple's servers, which drop the connection
      # now and then (stapler: "The network connection was lost", error
      # 68): those are tried up to 5 times, as package.sh's staple.
      - name: Check the dmg
        run: |
          retry() {
            n=$1; shift
            for i in $(seq "$n"); do
              "$@" && return 0
              [ "$i" -lt "$n" ] && { echo "retrying in 15 s ($i/$n failed): $*"; sleep 15; }
            done
            return 1
          }
          dmg="dist/gtty-${TAG#v}-macos.dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          retry 5 xcrun stapler validate "$dmg"
          retry 5 spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | sed -n 's|^/dev/[^[:space:]]*[[:space:]]*Apple_HFS[[:space:]]*||p')
          codesign --verify --deep --strict --verbose=2 "$mnt/gtty.app"
          retry 5 spctl --assess --type execute --verbose "$mnt/gtty.app"
          hdiutil detach -quiet "$mnt"

      # SHA256SUMS for users; the same lines, base64, are the provenance's
      # subjects.
      - name: Checksums
        id: sums
        run: |
          v=${TAG#v}
          cd dist
          shasum -a 256 "gtty-$v-macos.dmg" "gtty_${v}_amd64.deb" \
            "gtty-$v-1.x86_64.rpm" "gtty-$v-linux-x86_64.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          echo "hashes=$(base64 < SHA256SUMS | tr -d '\n')" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${TAG#v}
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "dist/gtty-$v-macos.dmg" "dist/gtty_${v}_amd64.deb" \
            "dist/gtty-$v-1.x86_64.rpm" "dist/gtty-$v-linux-x86_64.tar.gz" \
            dist/SHA256SUMS

  # SLSA build provenance for the Signed-Releases check, uploaded to the
  # release as gtty.intoto.jsonl. The generator must be referenced by tag,
  # not SHA (its documented requirement; Scorecard accepts it).
  provenance:
    name: SLSA provenance
    needs: [channel, build]
    permissions:
      actions: read # read the workflow run
      id-token: write # sign the provenance
      contents: write # upload it to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: gtty.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ needs.channel.outputs.tag }}
