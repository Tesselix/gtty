#
# The pull request gate: gtty must build on Linux, and its dependencies
# must pass deps.yml. No tests, no artifacts, no secrets. Every platform
# (macOS too) is built only when a release is published (release.yml).
# The job build-and-test is the status check main's ruleset requires;
# keep its id and name.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its run still going; runs on main
# all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: setup-zig reads minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      # SDL3 / SDL3_ttf / freetype from source (-Dbundled-sdl): the
      # distribution's SDL3 may be missing or too old.
      - name: Build
        run: zig build -Dbundled-sdl

  # The dependencies' licenses and known vulnerabilities (deps.yml):
  # vulnerabilities are only warnings here, with a version to pin.
  deps:
    name: Dependencies
    uses: ./.github/workflows/deps.yml
    with:
      vulns: warn
    permissions:
      contents: read
      pull-requests: write # deps.yml's report comment

  # The required status check: green only when the build and the
  # dependency check are.
  build-and-test:
    name: build-and-test
    needs: [build, deps]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed
        env:
          BUILD: ${{ needs.build.result }}
          DEPS: ${{ needs.deps.result }}
        run: |
          echo "build: $BUILD, deps: $DEPS"
          [ "$BUILD" = success ] && [ "$DEPS" = success ]
