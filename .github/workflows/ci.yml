#
# The pull request gate: gtty must build on Linux. Build only: no tests,
# no artifacts, no secrets. Every platform (macOS too) is built only when
# a release is published (release.yml).
# The job build-and-test is the status check main's ruleset requires;
# keep its id and name.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its run still going; runs on main
# all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: setup-zig reads minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      # SDL3 / SDL3_ttf / freetype from source (-Dbundled-sdl): the
      # distribution's SDL3 may be missing or too old.
      - name: Build
        run: zig build -Dbundled-sdl

  # The required status check: green only when the build is.
  build-and-test:
    name: build-and-test
    needs: [build]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All builds passed
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build: $RESULT"
          [ "$RESULT" = success ]
