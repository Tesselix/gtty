#
# The pull request gate: gtty must build on Linux, every release target
# must build and package as release.yml does it, and the dependencies
# must pass deps.yml. No tests, no artifacts, no secrets.
# The job build-and-test is the status check main's ruleset requires;
# keep its id and name.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its run still going; runs on main
# all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: setup-zig reads minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      # SDL3 / SDL3_ttf / freetype from source (-Dbundled-sdl): the
      # distribution's SDL3 may be missing or too old.
      - name: Build
        run: zig build -Dbundled-sdl

  # The SDKs (sdks/): Zig's tests, then every language's hosts example
  # through the shared stand-in for gtty (sdks/conformance/fake_gtty.py).
  # Python, Node and Go are the runner image's own.
  sdks:
    name: SDKs (Zig, Python, JavaScript, Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Zig SDK tests and example
        working-directory: sdks/zig
        run: zig build test && zig build
      - name: Go SDK vet and example
        working-directory: sdks/go
        run: go vet ./... && go build -o "$RUNNER_TEMP/hosts-go" ./examples/hosts
      - name: Conformance
        working-directory: sdks
        run: |
          python3 conformance/fake_gtty.py -- zig/zig-out/bin/hosts
          python3 conformance/fake_gtty.py -- python3 python/examples/hosts.py
          python3 conformance/fake_gtty.py -- node javascript/examples/hosts.js
          python3 conformance/fake_gtty.py -- "$RUNNER_TEMP/hosts-go"

  # What release.yml builds, on the same runner: build-bin.sh (macOS arm64
  # + Linux x86_64, ReleaseSafe, stripped) and package.sh (dmg, deb, rpm,
  # tar.gz). Without secrets: the app is signed ad hoc, not notarized.
  release-build:
    name: Release build (all targets)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No version: setup-zig reads minimum_zig_version from build.zig.zon.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: Install packaging tools
        run: brew install nfpm
      - name: Build and package
        run: scripts/package.sh
      - name: List the packages
        run: ls -l dist

  # The dependencies' licenses and known vulnerabilities (deps.yml):
  # vulnerabilities are only warnings here, with a version to pin.
  deps:
    name: Dependencies
    uses: ./.github/workflows/deps.yml
    with:
      vulns: warn
    permissions:
      contents: read
      pull-requests: write # deps.yml's report comment

  # The required status check: green only when the builds and the
  # dependency check are.
  build-and-test:
    name: build-and-test
    needs: [build, sdks, release-build, deps]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All checks passed
        env:
          BUILD: ${{ needs.build.result }}
          SDKS: ${{ needs.sdks.result }}
          RELEASE: ${{ needs.release-build.result }}
          DEPS: ${{ needs.deps.result }}
        run: |
          echo "build: $BUILD, sdks: $SDKS, release build: $RELEASE, deps: $DEPS"
          [ "$BUILD" = success ] && [ "$SDKS" = success ] && [ "$RELEASE" = success ] && [ "$DEPS" = success ]
