#
# OpenSSF Scorecard (the ossf/scorecard-action template): checks the
# repository's security practices on main, weekly, and when branch
# protection changes. The results go to the Security tab (code scanning)
# and to the public Scorecard API, which feeds the README badge.
# Publishing requires this shape: no top-level env / defaults, a
# read-only token at the top, only these steps.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "27 4 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
